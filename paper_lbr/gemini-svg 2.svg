<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
    </marker>
    <marker id="arrow-red-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D32F2F" />
    </marker>
  </defs>

  <rect x="0" y="0" width="580" height="650" fill="#FAFAFA" rx="10" />
  <rect x="600" y="0" width="600" height="650" fill="#FAFAFA" rx="10" />
  
  <line x1="590" y1="20" x2="590" y2="630" stroke="#B0BEC5" stroke-width="2" stroke-dasharray="8,8" />

  <rect x="20" y="20" width="540" height="40" fill="#E8F5E9" rx="8" />
  <text x="290" y="45" font-size="18" font-weight="bold" fill="#2E7D32" text-anchor="middle">Condition A (2-source pool [E₁, E₂], K=2)</text>

  <text x="70" y="90" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Step 1</text>
  <rect x="30" y="250" width="80" height="80" fill="#7B1FA2" rx="8" />
  <text x="70" y="290" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Query</text>
  <text x="70" y="310" font-size="18" font-weight="bold" fill="white" text-anchor="middle">h_p</text>

  <path d="M 110 290 L 130 290 L 130 190 L 165 190" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 110 290 L 130 290 L 130 390 L 165 390" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />

  <text x="210" y="90" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Step 2</text>
  <rect x="170" y="160" width="80" height="60" fill="#1E88E5" rx="8" />
  <text x="210" y="196" font-size="20" font-weight="bold" fill="white" text-anchor="middle">E₁</text>
  
  <rect x="170" y="360" width="80" height="60" fill="#43A047" rx="8" />
  <text x="210" y="396" font-size="20" font-weight="bold" fill="white" text-anchor="middle">E₂</text>

  <path d="M 250 190 L 285 190" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 250 390 L 285 390" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />

  <text x="340" y="90" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Step 3</text>
  <rect x="290" y="160" width="100" height="60" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2" rx="8" />
  <text x="340" y="195" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">h_p · E₁ / τ</text>
  
  <rect x="290" y="360" width="100" height="60" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2" rx="8" />
  <text x="340" y="395" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">h_p · E₂ / τ</text>

  <path d="M 390 190 L 415 190 L 415 260 L 435 260" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 390 390 L 415 390 L 415 320 L 435 320" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />

  <text x="470" y="90" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Step 4</text>
  <rect x="440" y="220" width="60" height="140" fill="#37474F" rx="8" />
  <text x="470" y="295" font-size="16" font-weight="bold" fill="white" text-anchor="middle" transform="rotate(-90 470,295)">Softmax</text>

  <path d="M 500 290 L 530 290" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />

  <text x="400" y="550" font-size="16" font-weight="bold" fill="#333">Step 5: Attention Weights Wᵢ</text>
  
  <line x1="330" y1="480" x2="550" y2="480" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="6,4" />
  <text x="555" y="485" font-size="14" font-weight="bold" fill="#757575">FW=0.50 (1/2)</text>

  <rect x="250" y="500" width="124" height="30" fill="#1E88E5" rx="4" />
  <text x="312" y="521" font-size="16" font-weight="bold" fill="white" text-anchor="middle">W₁=0.62</text>
  
  <rect x="250" y="540" width="76" height="30" fill="#43A047" rx="4" />
  <text x="288" y="561" font-size="16" font-weight="bold" fill="white" text-anchor="middle">W₂=0.38</text>


  <rect x="620" y="20" width="560" height="40" fill="#FFEBEE" rx="8" />
  <text x="900" y="45" font-size="18" font-weight="bold" fill="#C62828" text-anchor="middle">Condition B (3-source pool [E₁, E₂, E₃], K=3)</text>

  <text x="670" y="90" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Step 1</text>
  <rect x="630" y="250" width="80" height="80" fill="#7B1FA2" rx="8" />
  <text x="670" y="290" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Query</text>
  <text x="670" y="310" font-size="18" font-weight="bold" fill="white" text-anchor="middle">h_p</text>

  <path d="M 710 290 L 730 290 L 730 150 L 765 150" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 710 290 L 765 290" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 710 290 L 730 290 L 730 430 L 765 430" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />

  <text x="810" y="90" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Step 2</text>
  <rect x="770" y="120" width="80" height="60" fill="#1E88E5" rx="8" />
  <text x="810" y="156" font-size="20" font-weight="bold" fill="white" text-anchor="middle">E₁</text>
  
  <rect x="770" y="260" width="80" height="60" fill="#43A047" rx="8" />
  <text x="810" y="296" font-size="20" font-weight="bold" fill="white" text-anchor="middle">E₂</text>

  <rect x="765" y="395" width="90" height="70" fill="none" stroke="#D32F2F" stroke-width="3" stroke-dasharray="5,5" rx="10" />
  <rect x="770" y="400" width="80" height="60" fill="#FB8C00" rx="8" />
  <text x="810" y="436" font-size="20" font-weight="bold" fill="white" text-anchor="middle">E₃</text>
  <rect x="730" y="380" width="50" height="20" fill="#D32F2F" rx="4" />
  <text x="755" y="394" font-size="12" font-weight="bold" fill="white" text-anchor="middle">added</text>

  <path d="M 850 150 L 885 150" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 850 290 L 885 290" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 850 430 L 885 430" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />

  <text x="940" y="90" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Step 3</text>
  <rect x="890" y="120" width="100" height="60" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2" rx="8" />
  <text x="940" y="155" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">h_p · E₁ / τ</text>
  
  <rect x="890" y="260" width="100" height="60" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2" rx="8" />
  <text x="940" y="295" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">h_p · E₂ / τ</text>

  <rect x="890" y="400" width="100" height="60" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="2" rx="8" />
  <text x="940" y="435" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">h_p · E₃ / τ</text>

  <path d="M 990 150 L 1020 150 L 1020 250 L 1045 250" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 990 290 L 1045 290" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <path d="M 990 430 L 1020 430 L 1020 330 L 1045 330" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />

  <text x="1075" y="90" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">Step 4</text>
  <rect x="1050" y="200" width="50" height="180" fill="#37474F" rx="8" />
  <text x="1075" y="290" font-size="16" font-weight="bold" fill="white" text-anchor="middle" transform="rotate(-90 1075,290)">Softmax</text>

  <path d="M 1100 290 L 1120 290" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow2)" />

  <text x="950" y="550" font-size="16" font-weight="bold" fill="#333">Step 5: Attention Weights Wᵢ</text>
  
  <line x1="880" y1="480" x2="1100" y2="480" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="6,4" />
  <text x="1105" y="485" font-size="14" font-weight="bold" fill="#757575">FW≈0.33 (1/3)</text>

  <rect x="800" y="500" width="94" height="30" fill="#1E88E5" rx="4" />
  <text x="847" y="521" font-size="16" font-weight="bold" fill="white" text-anchor="middle">W₁=0.47</text>
  
  <rect x="800" y="540" width="60" height="30" fill="#43A047" rx="4" />
  <text x="830" y="561" font-size="14" font-weight="bold" fill="white" text-anchor="middle">W₂=0.30</text>
  
  <rect x="800" y="580" width="46" height="30" fill="#FB8C00" rx="4" />
  <text x="823" y="601" font-size="12" font-weight="bold" fill="white" text-anchor="middle">W₃=0.23</text>


  <rect x="1000" y="515" width="180" height="70" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2" rx="8" />
  <text x="1090" y="540" font-size="16" font-weight="bold" fill="#D32F2F" text-anchor="middle">E₃ dilutes W₁ and W₂</text>
  <text x="1090" y="565" font-size="16" font-weight="bold" fill="#D32F2F" text-anchor="middle">(−0.15, −0.08)</text>

  <line x1="924" y1="505" x2="924" y2="525" stroke="#D32F2F" stroke-width="2" stroke-dasharray="4,2" />
  <path d="M 924 515 L 898 515" stroke="#D32F2F" stroke-width="3" fill="none" marker-end="url(#arrow-red-down)" />
  <text x="945" y="520" font-size="14" font-weight="bold" fill="#D32F2F">↓ 0.15</text>

  <line x1="876" y1="545" x2="876" y2="565" stroke="#D32F2F" stroke-width="2" stroke-dasharray="4,2" />
  <path d="M 876 555 L 864 555" stroke="#D32F2F" stroke-width="3" fill="none" marker-end="url(#arrow-red-down)" />
  <text x="895" y="560" font-size="14" font-weight="bold" fill="#D32F2F">↓ 0.08</text>

</svg>

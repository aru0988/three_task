<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D32F2F" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7B1FA2" />
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="260" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2" rx="12" />
  <text x="40" y="55" font-size="20" font-weight="bold" fill="#333">Stage 1: 3-task backbone pre-training → all parameters frozen</text>
  <text x="40" y="80" font-size="14" fill="#666">Training config: 10 epochs, GAN env_coe=0.1, uni_coe=0.9</text>

  <rect x="40" y="110" width="200" height="130" fill="#78909C" rx="8" />
  <text x="140" y="165" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Feature Embedding</text>
  <text x="140" y="190" font-size="14" fill="#E0F7FA" text-anchor="middle">(Frozen)</text>
  <text x="140" y="220" font-size="12" fill="white" text-anchor="middle" font-style="italic">GAN disentanglement</text>

  <rect x="340" y="90" width="180" height="50" fill="#37474F" rx="8" />
  <text x="430" y="120" font-size="16" fill="white" text-anchor="middle">Shared Expert</text>

  <rect x="340" y="150" width="180" height="40" fill="#455A64" rx="8" />
  <text x="430" y="176" font-size="16" fill="white" text-anchor="middle">Spec. Expert T1</text>
  
  <rect x="340" y="200" width="180" height="40" fill="#455A64" rx="8" />
  <text x="430" y="226" font-size="16" fill="white" text-anchor="middle">Spec. Expert T2</text>
  
  <rect x="340" y="250" width="180" height="40" fill="#455A64" rx="8" />
  <text x="430" y="276" font-size="16" fill="white" text-anchor="middle">Spec. Expert T3</text>

  <rect x="620" y="150" width="180" height="40" fill="#1E88E5" rx="8" />
  <text x="710" y="176" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Task Emb E₁ (Income)</text>
  
  <rect x="620" y="200" width="180" height="40" fill="#43A047" rx="8" />
  <text x="710" y="226" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Task Emb E₂ (Marital)</text>
  
  <rect x="620" y="250" width="180" height="40" fill="#FB8C00" rx="8" />
  <text x="710" y="276" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Task Emb E₃ (Edu)</text>

  <path d="M 240 140 L 290 140 L 290 115 L 335 115" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 240 170 L 335 170" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 240 190 L 290 190 L 290 220 L 335 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 240 210 L 270 210 L 270 270 L 335 270" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <path d="M 520 170 L 615 170" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 520 220 L 615 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 520 270 L 615 270" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <text x="620" y="120" font-size="14" fill="#37474F" font-weight="bold">→ gen_rep</text>
  <path d="M 520 115 L 610 115" stroke="#37474F" stroke-width="2" stroke-dasharray="4,4" fill="none" />

  <rect x="20" y="320" width="980" height="160" fill="#E8F5E9" rx="12" /> <rect x="20" y="490" width="980" height="180" fill="#FFEBEE" rx="12" /> <text x="40" y="345" font-size="18" font-weight="bold" fill="#2E7D32">Stage 2: Condition A (2-source candidate pool)</text>
  <text x="40" y="515" font-size="18" font-weight="bold" fill="#C62828">Stage 2: Condition B (3-source candidate pool)</text>
  <text x="400" y="310" font-size="16" font-weight="bold" fill="#7B1FA2">New task prompt tuning (< 10% params)</text>

  <rect x="40" y="420" width="140" height="60" fill="#E65100" rx="8" />
  <text x="110" y="445" font-size="16" font-weight="bold" fill="white" text-anchor="middle">New Task</text>
  <text x="110" y="465" font-size="16" font-weight="bold" fill="white" text-anchor="middle">T4 Label</text>

  <rect x="230" y="420" width="160" height="60" fill="#7B1FA2" rx="8" />
  <text x="310" y="445" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Projection</text>
  <text x="310" y="465" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Network</text>

  <path d="M 180 450 L 225 450" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <path d="M 390 440 L 410 440 L 410 395 L 445 395" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />
  
  <rect x="450" y="360" width="220" height="70" fill="#37474F" rx="8" />
  <text x="560" y="390" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Softmax(h_p · [E₁, E₂] / τ)</text>
  <text x="560" y="415" font-size="14" fill="#B0BEC5" text-anchor="middle">τ = 150</text>

  <path d="M 670 395 L 705 395" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <rect x="710" y="370" width="62" height="18" fill="#1E88E5" />
  <text x="777" y="384" font-size="14" fill="#333" font-weight="bold">W₁=0.62</text>
  <rect x="710" y="395" width="38" height="18" fill="#43A047" />
  <text x="753" y="409" font-size="14" fill="#333" font-weight="bold">W₂=0.38</text>

  <rect x="840" y="365" width="100" height="60" fill="#00838F" rx="8" />
  <text x="890" y="400" font-size="16" font-weight="bold" fill="white" text-anchor="middle">New Tower</text>

  <path d="M 940 395 L 970 395" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="975" y="400" font-size="18" font-weight="bold" fill="#333">ŷ_{T4}^(A)</text>

  <path d="M 390 460 L 410 460 L 410 575 L 445 575" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />
  
  <rect x="450" y="540" width="240" height="70" fill="#37474F" rx="8" />
  <text x="570" y="570" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Softmax(h_p · [E₁, E₂, E₃] / τ)</text>
  <text x="570" y="595" font-size="14" fill="#B0BEC5" text-anchor="middle">τ = 150</text>

  <path d="M 690 575 L 705 575" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <rect x="710" y="535" width="47" height="18" fill="#1E88E5" />
  <text x="762" y="549" font-size="14" fill="#333" font-weight="bold">W₁=0.47</text>
  <rect x="710" y="558" width="30" height="18" fill="#43A047" />
  <text x="745" y="572" font-size="14" fill="#333" font-weight="bold">W₂=0.30</text>
  <rect x="710" y="581" width="23" height="18" fill="#FB8C00" />
  <text x="738" y="595" font-size="14" fill="#333" font-weight="bold">W₃=0.23</text>

  <rect x="840" y="545" width="100" height="60" fill="#00838F" rx="8" />
  <text x="890" y="580" font-size="16" font-weight="bold" fill="white" text-anchor="middle">New Tower</text>

  <path d="M 940 575 L 970 575" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="975" y="580" font-size="18" font-weight="bold" fill="#333">ŷ_{T4}^(B)</text>

  <g transform="translate(1030, 360)">
    <path d="M 40 40 L 40 210" stroke="#D32F2F" stroke-width="4" fill="none" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
    
    <rect x="0" y="90" width="150" height="70" fill="white" stroke="#D32F2F" stroke-width="2" rx="5" />
    <text x="75" y="115" font-size="16" font-weight="bold" fill="#D32F2F" text-anchor="middle">Δ(B−A)</text>
    <text x="75" y="135" font-size="14" font-weight="bold" fill="#D32F2F" text-anchor="middle">Causal Effect</text>
    <text x="75" y="150" font-size="12" fill="#D32F2F" text-anchor="middle">Backbones = Identical</text>
  </g>
  
</svg>
